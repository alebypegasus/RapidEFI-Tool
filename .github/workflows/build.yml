name: Build & Release

# ── 触发规则 ────────────────────────────────────────────
# workflow_dispatch → Stable (手动发布，输入版本号，生成 tag "vX.Y.Z")
# push v* tag       → Stable (手动推 tag 也可触发)
# ─────────────────────────────────────────────────────────
on:
  push:
    tags:     [ 'v*' ]

  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (必填，例如 5.2.2)'
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: RapidEFI

# 同一 ref 的旧构建自动取消（节省 runner 资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────
  # 1. 解析发布通道 & tag
  # ──────────────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.info.outputs.tag }}
      version:    ${{ steps.info.outputs.version }}

    steps:
      - name: Resolve tag / version
        id: info
        run: |
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # ── Stable：推送 v* tag ────────────────────
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # ── Stable：手动指定版本 ──────────────────
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::未提供版本号或无法解析 tag" && exit 1
          fi

          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"

          # Step summary
          {
            echo "### 📦 Build info"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Tag | \`$TAG\` |"
            echo "| Version | \`$VERSION\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────
  # 2. 矩阵构建：6 个组合（2 arch × 3 OS）
  # ──────────────────────────────────────────────────────
  build:
    name: Build · ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ────────────────────────────────
          - label:          Windows-x64
            runner:         windows-latest
            os:             windows
            arch:           x64
            build_dir:      build/windows/x64/runner/Release
            pkg_ext:        zip
            flutter_sdk_arch: x64      # 原生 x64 SDK
            flutter_manual: false

          # Windows-arm64 暂时禁用
          # - label:          Windows-arm64
          #   runner:         windows-11-arm
          #   os:             windows
          #   arch:           arm64
          #   build_dir:      build/windows/arm64/runner/Release
          #   pkg_ext:        zip
          #   flutter_sdk_arch: x64
          #   flutter_manual: false

          # ── Linux ──────────────────────────────────
          - label:          Linux-x64
            runner:         ubuntu-latest
            os:             linux
            arch:           x64
            build_dir:      build/linux/x64/release/bundle
            pkg_ext:        tar.gz
            flutter_sdk_arch: x64
            flutter_manual: false

          # Linux-arm64 暂时禁用（ubuntu-24.04-arm runner 网络不稳定）
          # - label:          Linux-arm64
          #   runner:         ubuntu-24.04-arm
          #   os:             linux
          #   arch:           arm64
          #   build_dir:      build/linux/arm64/release/bundle
          #   pkg_ext:        tar.gz
          #   flutter_sdk_arch: arm64
          #   flutter_manual: true

          # ── macOS ──────────────────────────────────
          - label:          macOS-Universal
            runner:         macos-15
            os:             macos
            arch:           universal
            build_dir:      build/macos/Build/Products/Release
            pkg_ext:        dmg
            flutter_sdk_arch: arm64
            flutter_manual: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux 系统依赖 ──────────────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          # ARM64 runner 用 ports.ubuntu.com 经常超时，切换到 Azure 镜像 + 强制 IPv4
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          # sources.list（传统格式）
          sudo sed -i 's|http://ports.ubuntu.com|http://azure.ports.ubuntu.com|g' \
            /etc/apt/sources.list 2>/dev/null || true
          # ubuntu.sources（Ubuntu 24.04 DEB822 格式）
          sudo sed -i 's|http://ports.ubuntu.com|http://azure.ports.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

          sudo apt-get update -y
          sudo apt-get install -y -o Acquire::Retries=3 \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libpango1.0-dev libcairo2-dev \
            libgdk-pixbuf2.0-dev libatk1.0-dev

      # ── Flutter：action（除 Linux arm64 外全部使用）────
      - name: Setup Flutter
        if: "!matrix.flutter_manual"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          architecture: ${{ matrix.flutter_sdk_arch }}

      # ── Flutter：手动安装（仅 Linux arm64）────────────
      # subosito/flutter-action 无法自动发现 linux/arm64 版本
      - name: Setup Flutter (Linux arm64, manual)
        if: matrix.flutter_manual
        shell: bash
        run: |
          BASE="https://storage.googleapis.com/flutter_infra_release/"
          JSON=$(curl -fsSL "${BASE}releases/releases_linux.json")

          # 优先从 JSON archive 字段获取 arm64 路径（最可靠，不用猜文件名格式）
          ARCHIVE=$(echo "$JSON" | jq -r '
            .current_release.stable as $h |
            .releases[] |
            select(.hash == $h) |
            select(.archive | test("arm64"; "i")) |
            .archive
          ' | head -1)

          # 回退：版本号拼 URL
          if [ -z "$ARCHIVE" ]; then
            VER=$(echo "$JSON" | jq -r \
              '.current_release.stable as $h | .releases[] | select(.hash == $h) | .version' \
              | head -1)
            ARCHIVE="releases/stable/linux/flutter_linux_arm64_${VER}-stable.tar.xz"
          fi

          echo "Downloading: ${BASE}${ARCHIVE}"
          curl -fsSL "${BASE}${ARCHIVE}" -o flutter.tar.xz
          tar xf flutter.tar.xz -C "$HOME"
          rm flutter.tar.xz
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - run: flutter pub get

      # ── Windows：设置与构建目标架构匹配的 JDK ─────────
      # windows-latest 现已是 ARM64 runner，默认 JDK 也是 aarch64；
      # jni 插件链接时需要与目标架构一致的 jvm.lib，必须显式指定。
      - name: Setup Java (match build arch)
        if: matrix.os == 'windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.arch }}

      # ── 修复 permission_handler_windows 在 MSVC 14.51+ 下的 C2338 错误 ──
      # CMAKE_CXX_FLAGS 无法可靠传递到插件 vcxproj，直接 patch pub cache 是唯一可靠方案
      - name: Patch permission_handler_windows (MSVC coroutine compat)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $hosted = "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev"
          $dirs   = Get-ChildItem -Path $hosted -Filter "permission_handler_windows*" -Directory -ErrorAction SilentlyContinue
          foreach ($dir in $dirs) {
            $cmake = Join-Path $dir.FullName "windows\CMakeLists.txt"
            if (Test-Path $cmake) {
              $txt = Get-Content $cmake -Raw
              if ($txt -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS') {
                Add-Content -Path $cmake -Value "`nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
                Write-Host "Patched: $cmake"
              } else {
                Write-Host "Already patched: $cmake"
              }
            }
          }

      # ── 版本号写入 pubspec.yaml ─────────────────────
      # pubspec 只接受 X.Y.Z+buildNumber 格式（纯整数）
      - name: Patch pubspec version
        shell: bash
        run: |
          SEMVER="${{ needs.prepare.outputs.version }}"
          sed -i.bak "s/^version: .*/version: ${SEMVER}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      # ── 构建 ───────────────────────────────────────
      - name: Build
        shell: bash
        run: flutter build ${{ matrix.os }} --release

      # ── 打包：Windows ───────────────────────────────
      - name: Package (Windows zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Copy-Item -Path "docs\dll\*.dll" -Destination "${{ matrix.build_dir }}" -Force
          $dest = "${{ env.APP_NAME }}-${{ matrix.label }}.zip"
          Compress-Archive -Path "${{ matrix.build_dir }}\*" -DestinationPath $dest -Force

      # ── 打包：Linux ─────────────────────────────────
      - name: Package (Linux tar.gz)
        if: matrix.os == 'linux'
        run: |
          tar -czf "$GITHUB_WORKSPACE/${{ env.APP_NAME }}-${{ matrix.label }}.tar.gz" \
              -C "${{ matrix.build_dir }}" .

      # ── 打包：macOS ─────────────────────────────────
      - name: Package (macOS dmg)
        if: matrix.os == 'macos'
        run: |
          cd "${{ matrix.build_dir }}"
          brew install create-dmg
          create-dmg \
            --overwrite \
            --window-size 600 400 \
            --app-drop-link 400 150 \
            --icon "${{ env.APP_NAME }}.app" 200 150 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            "$GITHUB_WORKSPACE/${{ env.APP_NAME }}-${{ matrix.label }}.dmg" \
            "${{ env.APP_NAME }}.app"

      # ── 上传 ───────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.label }}
          path: ${{ env.APP_NAME }}-${{ matrix.label }}.${{ matrix.pkg_ext }}
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # 3. 发布 Release
  #    stable：创建全新版本 release，带友好的更新日志
  # ──────────────────────────────────────────────────────
  release:
    name: Release · ${{ needs.prepare.outputs.tag }}
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── 下载所有构建产物 ────────────────────────────
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist/

      # ── stable：创建正式版本 release ──────────────────
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          
          # 生成友好的详细 Release Notes
          cat << EOF > release_notes.md
          ## 🎉 RapidEFI $TAG Released!

          Welcome to the latest version of RapidEFI! Select your language below to read the release notes.

          <details>
          <summary>🇧🇷 Português</summary>
          <br>
          Olá! 🚀 Chegou uma nova versão cheia de melhorias para tornar sua experiência ainda melhor.

          ✨ **O que há de novo nesta versão:**
          - 🐛 Correções de bugs e melhorias na estabilidade geral do sistema.
          - ⚡ Otimizações de desempenho para que tudo carregue mais rápido.
          - 🎨 Melhorias sutis na interface para uma navegação mais fluída.
          </details>

          <details>
          <summary>🇬🇧 English</summary>
          <br>
          Hello! 🚀 A new version full of improvements has arrived to make your experience even better.

          ✨ **What's new in this version:**
          - 🐛 Bug fixes and overall system stability improvements.
          - ⚡ Performance optimizations for faster loading.
          - 🎨 Subtle UI enhancements for smoother navigation.
          </details>

          <details>
          <summary>🇪🇸 Español</summary>
          <br>
          ¡Hola! 🚀 Ha llegado una nueva versión llena de mejoras para hacer tu experiencia aún mejor.

          ✨ **Qué hay de nuevo en esta versión:**
          - 🐛 Corrección de errores y mejoras en la estabilidad general del sistema.
          - ⚡ Optimizaciones de rendimiento para que todo cargue más rápido.
          - 🎨 Mejoras sutiles en la interfaz para una navegación más fluida.
          </details>

          <details>
          <summary>🇫🇷 Français</summary>
          <br>
          Bonjour ! 🚀 Une nouvelle version pleine d'améliorations est arrivée pour rendre votre expérience encore meilleure.

          ✨ **Quoi de neuf dans cette version :**
          - 🐛 Corrections de bugs et améliorations générales de la stabilité du système.
          - ⚡ Optimisations des performances pour un chargement plus rapide.
          - 🎨 Améliorations subtiles de l'interface pour une navigation plus fluide.
          </details>

          <details>
          <summary>🇷🇺 Русский</summary>
          <br>
          Привет! 🚀 Вышла новая версия с множеством улучшений для еще более комфортной работы.

          ✨ **Что нового в этой версии:**
          - 🐛 Исправления ошибок и повышение общей стабильности системы.
          - ⚡ Оптимизация производительности для более быстрой загрузки.
          - 🎨 Небольшие улучшения интерфейса для более плавной навигации.
          </details>

          <details>
          <summary>🇮🇹 Italiano</summary>
          <br>
          Ciao! 🚀 È arrivata una nuova versione ricca di miglioramenti per rendere la tua esperienza ancora migliore.

          ✨ **Cosa c'è di nuovo in questa versione:**
          - 🐛 Correzioni di bug e miglioramenti generali della stabilità del sistema.
          - ⚡ Ottimizzazioni delle prestazioni per un caricamento più rapido.
          - 🎨 Sottili miglioramenti dell'interfaccia per una navigazione più fluida.
          </details>

          <details>
          <summary>🇮🇳 हिन्दी (Hindi)</summary>
          <br>
          नमस्ते! 🚀 आपके अनुभव को और भी बेहतर बनाने के लिए सुधारों से भरा एक नया संस्करण आ गया है।

          ✨ **इस संस्करण में नया क्या है:**
          - 🐛 बग फिक्स और समग्र सिस्टम स्थिरता में सुधार।
          - ⚡ तेज लोडिंग के लिए प्रदर्शन अनुकूलन।
          - 🎨 सुचारू नेविगेशन के लिए सूक्ष्म इंटरफ़ेस सुधार।
          </details>

          <details>
          <summary>🇸🇦 العربية (Arabic)</summary>
          <br>
          مرحباً! 🚀 وصلت نسخة جديدة مليئة بالتحسينات لجعل تجربتك أفضل بكثير.

          ✨ **ما الجديد في هذه النسخة:**
          - 🐛 إصلاحات للأخطاء وتحسينات على استقرار النظام بشكل عام.
          - ⚡ تحسينات في الأداء لتحميل أسرع.
          - 🎨 تحسينات دقيقة على واجهة المستخدم لتنقل أكثر سلاسة.
          </details>

          <details>
          <summary>🇨🇳 中文</summary>
          <br>
          你好！🚀 充满改进的新版本已经到来，让您的体验更上一层楼。

          ✨ **此版本的新内容：**
          - 🐛 错误修复和系统整体稳定性的提升。
          - ⚡ 性能优化，加载速度更快。
          - 🎨 细微的界面改进，让导航更流畅。
          </details>

          <details>
          <summary>🇯🇵 日本語</summary>
          <br>
          こんにちは！🚀 より良い体験を提供するため、多くの改善を含んだ新しいバージョンがリリースされました。

          ✨ **このバージョンの新機能：**
          - 🐛 バグ修正とシステム全体の安定性向上。
          - ⚡ より高速な読み込みのためのパフォーマンス最適化。
          - 🎨 よりスムーズなナビゲーションのための細かなUI改善。
          </details>

          ---
          
          📦 **Downloads / Descargas / 下载 :**
          - 🪟 **Windows**: \`.zip\`
          - 🍎 **macOS**: \`.dmg\`
          - 🐧 **Linux**: \`.tar.gz\`

          *Download the file corresponding to your Operating System.*
          
          ❤️ Thank you for using RapidEFI!
          EOF
          
          gh release create "$TAG" dist/* \
            --title "🚀 ${APP_NAME} ${TAG}" \
            --notes-file release_notes.md \
            --latest
